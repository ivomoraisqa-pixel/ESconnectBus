<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup do Totem ConnectBus</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .setup-box {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }
    input {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      color: white;
      font-size: 24px;
      text-align: center;
      width: 100%;
      padding: 15px;
      font-family: monospace;
      letter-spacing: 4px;
      text-transform: uppercase;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button:hover {
      background: #0ea5e9;
    }
    .error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="setup-box">
    <h1>Conectar Equipamento</h1>
    <p>Digite o PIN fornecido no painel da central para provisionar este totem automaticamente.</p>
    
    <input type="text" id="pin-input" placeholder="ID-CÓDIGO" maxlength="20">
    <div id="error-msg" class="error">PIN inválido. Tente novamente.</div>
    <button onclick="pairTotem()" id="btn-pair">Sincronizar Totem</button>
  </div>

  <script>
    const input = document.getElementById('pin-input');
    
    input.addEventListener('input', function(e) {
      // Aceita letras, números e traço, tudo em maiúsculo
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
    });

    async function pairTotem() {
      const pin = input.value;
      const btn = document.getElementById('btn-pair');
      const err = document.getElementById('error-msg');
      
      if(pin.length < 3 || !pin.includes('-')) {
        err.style.display = 'block';
        return;
      }
      
      btn.textContent = "Validando...";
      btn.disabled = true;
      err.style.display = 'none';

      try {
        const response = await fetch('http://localhost:3000/api/v1/transport/totem/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        
        if (!response.ok) throw new Error("PIN Inválido");
        
        const config = await response.json();
        
        // Sucesso! Salva a configuração corporativa no cérebro do navegador (LocalStorage)
        localStorage.setItem('totem_config', JSON.stringify(config));
        
        // Redireciona para o Totem Player!
        btn.style.background = "#22c55e";
        btn.textContent = "Sincronizado! Iniciando...";
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
        
      } catch(e) {
        err.style.display = 'block';
        btn.textContent = "Sincronizar Totem";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
